\"ほのお\")?.5:(b.weather===\"sun\"&&moveType===\"ほのお\")?1.5:(b.weather===\"sun\"&&moveType===\"みず\")?.5:(b.weather===\"sand\"&&[\"いわ\",\"じめん\",\"はがね\"].includes(moveType))?1.1:(b.weather===\"snow\"&&moveType===\"こおり\")?1.5:1;\n  let terrain=(b.field===\"electric\"&&moveType===\"でんき\")?1.3:(b.field===\"grassy\"&&moveType===\"くさ\")?1.3:(b.field===\"psychic\"&&moveType===\"エスパー\")?1.3:(b.field===\"misty\"&&moveType===\"ドラゴン\")?.5:1;\n  if(b.field===\"grassy\" && moveHasEffect(move,\"grassy_power_half\")) terrain*=0.5;\n  let itemMult=1;const item=itemWorks(a,moveType);\n  if(move.contact && abilityHasEffect(a,\"contact_power_1_3\")) itemMult*=1.3;\n  const defenderHeldItem = !!itemId(d);\n  if(moveHasEffect(move,\"item_power_1_5\") && defenderHeldItem) itemMult*=1.5;\n  if(item?.effect===\"life_orb\")itemMult*=1.3;\n  if(item?.effect===\"power_1_2\")itemMult*=1.2;\n  if(item?.effect===\"power_1_3_recoil\")itemMult*=1.3;\n  for(const aid of abilityIds(a)){\n    const ab=getAbility(aid); if(!ab || !effectTypesMatch(ab,move.type)) continue;\n    if(abilityEffects(ab).includes(\"power_1_2\")){itemMult*=1.2;b.log.push(`${a.name}の特性「${ab.name||aid}」で技の威力が1.2倍になった！`);} \n    if(abilityEffects(ab).includes(\"power_1_3_recoil\")){itemMult*=1.3;b.log.push(`${a.name}の特性「${ab.name||aid}」で技の威力が1.3倍になった！`);} \n  }\n  if(abilityWorks(a,\"blaze\",moveType)&&moveType===\"ほのお\"&&attSide.hp[ai]<=attSide.maxHp[ai]/3)mult*=1.5;\n  if(abilityWorks(a,\"torrent\",moveType)&&moveType===\"みず\"&&attSide.hp[ai]<=attSide.maxHp[ai]/3)mult*=1.5;\n  if(abilityWorks(a,\"huge_power\",moveType)&&category===\"physical\")base*=2;\n  if(base < 0) base=0;\n  for(const aid of abilityIds(a)){\n    const ab=getAbility(aid);\n    if(abilityEffects(ab).includes(\"power_1_5_under_60\") && effectTypesMatch(ab,moveType) && Number(move.power||0)<60){itemMult*=1.5;b.log.push(`${a.name}の特性「${ab.name||aid}」で威力60未満の技が1.5倍になった！`);}\n    if(abilityEffects(ab).includes(\"faint_ally_power_1_1\")){\n      const fainted=attSide.selected.filter(x=>x!==ai && attSide.hp[x]<=0).length;\n      if(fainted>0){itemMult*=1+(0.1*fainted);b.log.push(`${a.name}の特性で瀕死の味方${fainted}匹分、技の威力が上がった！`);}\n    }\n  }\n  const crit=Math.random()<0.0625?1.5:1;\n  const random=0.85+Math.random()*0.15;\n    let wall=1;\n  if(!moveHasEffect(move,\"wall_break\")){\n    if(category===\"physical\" && (defSide.walls.reflect>0 || defSide.walls.aurora_veil>0)) wall*=0.5;\n    if(category===\"special\" && (defSide.walls.light_screen>0 || defSide.walls.aurora_veil>0)) wall*=0.5;\n  }\n  return {damage:Math.max(1,Math.floor(base*stab*mult*weather*terrain*itemMult*wall*crit*random)),mult,stab,crit,moveType};\n}\nfunction triggerReceivedTypeStatBoost(b,attSide,defSide,move,di){\n  const moveType=effectiveMoveType(attSide.team[attSide.active],move);\n  const target=defSide.team[di];\n  if(!target || defSide.hp[di]<=0) return;\n  for(const aid of abilityIds(target)){\n    const ab=getAbility(aid);\n    if(!ab || !abilityEffects(ab).includes(\"received_type_stat_boost\")) continue;\n    if(ab.receivedMoveType !== moveType) continue;\n    const stat=STAT_NAMES[ab.receivedStat] && ab.receivedStat !== \"hp\" ? ab.receivedStat : null;\n    if(!stat) continue;\n    const stages=clamp(Number(ab.receivedStages||1),1,3);\n    addBoost(b,defSide,di,stat,stages);\n    b.log.push(`${target.name}の特性「${ab.name||aid}」で${moveType}タイプの技を受け、${STAT_NAMES[stat]}が${stages}段階上がった！`);\n  }\n}\nfunction doMove(b,attSide,defSide,move){\n  const ai=attSide.active;\n  const target=move.target||\"opponent\";\n  const targetSide=target===\"self\"?attSide:(target===\"field\"?null:defSide);\n  const di=targetSide?targetSide.active:null;\n  const a=attSide.team[ai],d=targetSide?targetSide.team[di]:null;\n  const effects=moveEffectsOf(move);\n  if(!canAct(b,attSide,ai))return {switched:false};\n  const choice=getItem(itemId(a));\n  if([\"choice_1_5_lock\",\"choice_attack_1_5\",\"choice_spAttack_1_5\",\"choice_speed_1_5\"].includes(choice?.effect)) {\n    if(attSide.choiceMove[ai] && String(attSide.choiceMove[ai])!==String(move.id)) throw new Error(`${a.name}はこだわり状態で${getMove(attSide.choiceMove[ai])?.name||\"その技\"}しか使えません。`);\n    if(!attSide.choiceMove[ai]) { attSide.choiceMove[ai]=String(move.id); b.log.push(`${a.name}は${move.name}にこだわった！`); }\n  }\n  if(targetSide && move.category===\"status\" && hasAbility(d,\"status_immune\")){b.log.push(`${d.name}は相手の変化技を受けない！`);return {switched:false};}\n\n  // 場に出てから最初に選んだ技のタイプを自分のタイプにする。\n  if(abilityHasEffect(a,\"first_move_type\") && !attSide.volatile[ai]?.firstMoveTypeDone){\n    const firstType=effectiveMoveType(a,move); a.type=[firstType]; attSide.volatile[ai].firstMoveTypeDone=true;\n    b.log.push(`${a.name}は${firstType}タイプになった！`);\n  }\n  const moveType=effectiveMoveType(a,move);\n  const chance=()=>effectRoll(move);\n  let switched=false;\n\n  // 複数効果を順番に処理する。攻撃技にも変化効果を併設できる。\n  if(effects.includes(\"stealth_rock\") && chance()) setHazard(b,attSide,\"stealth_rock\");\n  if(effects.includes(\"spikes\") && chance()) setHazard(b,attSide,\"spikes\");\n  if(effects.includes(\"set_weather\") && chance()) setWeather(b,move.weather,Number(move.duration||5),attSide);\n  if(effects.includes(\"set_field\") && chance()) setField(b,move.field,Number(move.fieldDuration||move.duration||5),attSide);\n  for(const wall of [\"light_screen\",\"reflect\",\"aurora_veil\"]){if(effects.includes(wall)&&chance()) setWall(b,attSide,wall,Number(move.duration||5));}\n  if(effects.includes(\"protect\") && chance()){attSide.protected[ai]=true;b.log.push(`${a.name}はまもるを使った！`);}\n  if(effects.includes(\"recover\") && chance()){const heal=Math.max(1,Math.floor(attSide.maxHp[ai]/2));attSide.hp[ai]=Math.min(attSide.maxHp[ai],attSide.hp[ai]+heal);b.log.push(`${a.name}は${heal}回復した！`);}\n  if(target===\"field\"){\n    if(effects.includes(\"stealth_rock\")||effects.includes(\"spikes\")||effects.some(e=>[\"set_weather\",\"set_field\",\"light_screen\",\"reflect\",\"aurora_veil\"].includes(e))) return {switched:false};\n    return {switched:false};\n  }\n  if(effects.includes(\"swords_dance\") && chance()) addBoost(b,attSide,ai,\"attack\",2);\n  if(effects.includes(\"nasty_plot\") && chance()) addBoost(b,attSide,ai,\"spAttack\",2);\n  if(effects.includes(\"dragon_dance\") && chance()){addBoost(b,attSide,ai,\"attack\",1);addBoost(b,attSide,ai,\"speed\",1);}\n  if((effects.includes(\"stat_boost\")||effects.includes(\"stat_drop\")) && chance()){\n    const key=STAT_NAMES[move.effectStat]?move.effectStat:null;\n    const amount=(effects.includes(\"stat_drop\")&&!effects.includes(\"stat_boost\")?-1:1)*clamp(Number(move.effectStages||1),1,3);\n    if(key){const target=move.effectTarget===\"opponent\"?defSide:attSide;const ti=move.effectTarget===\"opponent\"?di:ai;addBoost(b,target,ti,key,amount);}\n  }\n\n  const power=Number(move.power||0);\n  if(power<=0){\n    if(targetSide && effects.includes(\"remove_item\") && d.hp[di]>0 && chance() && itemId(d)){const oldItem=getItem(itemId(d)); if(!isMegaStone(oldItem)){d.itemId=null;d.item=null;defSide.itemLost[di]=true;b.log.push(`${d.name}の持ち物「${oldItem?.name||\"\"}」がなくなった！`);} else { b.log.push(`${d.name}のメガストーンはなくならなかった！`); }}\n    if(targetSide && effects.includes(\"change_opponent_type\") && d.hp[di]>0 && chance()){const types=Array.isArray(move.effectAddTypes)?move.effectAddTypes.filter(t=>ALL_TYPES.includes(t)):[move.effectAddType].filter(t=>ALL_TYPES.includes(t));d.type=types;b.log.push(`${d.name}のタイプが${types.length?types.join(\"・\"):\"なし\"}になった！`);}\n    if(targetSide && (move.status||effects.includes(\"inflict_status\")) && d.hp[di]>0 && chance() && move.status) setStatus(b,defSide,di,move.status,move.category===\"status\");\n    if(targetSide && effects.includes(\"flinch\") && d.hp[di]>0 && chance()){defSide.volatile[di].flinch=true;b.log.push(`${d.name}はひるみそうだ！`);}\n    return {switched:false};\n  }\n\n  if(!d) return {switched:false};\n  const noMiss=abilityHasEffect(a,\"no_miss_both\") || abilityHasEffect(d,\"no_miss_both\");\n  const acc=Number(move.accuracy??100);if(!noMiss && acc<100&&Math.random()*100>=acc){b.log.push(`${a.name}の${move.name}は外れた！`);return {switched:false};}\n  if(defSide.protected[di]){b.log.push(`${d.name}はまもっている！`);return {switched:false};}\n  const preview=calcDamage(b,attSide,defSide,move);\n  if(preview.mult!==0) triggerReceivedTypeStatBoost(b,attSide,defSide,move,di);\n  const r=preview;\n  if(r.mult===0){b.log.push(`${a.name}の${move.name}！ しかし効果がない！`);return {switched:false};}\n  let damage=r.damage, survivedByAbility=false;\n  for(const aid of abilityIds(d)){\n    const ab=getAbility(aid);\n    if(abilityEffects(ab).includes(\"survive_once_1_8\") && defSide.volatile[di]?.surviveOnce!==true && damage>=defSide.hp[di]){damage=Math.max(0,defSide.hp[di]-1);defSide.volatile[di].surviveOnce=true;survivedByAbility=true;b.log.push(`${d.name}の特性「${ab.name||aid}」で攻撃を耐えた！`);break;}\n  }\n  if(!survivedByAbility && hasFullHpSurvival(d,moveType) && defSide.hp[di]===defSide.maxHp[di] && damage>=defSide.hp[di]){damage=Math.max(1,defSide.hp[di]-1);b.log.push(`${d.name}はHP満タンの効果で攻撃を1残して耐えた！`);}\n  defSide.hp[di]=Math.max(0,defSide.hp[di]-damage);\n  if(defSide.hp[di]>0) triggerHalfHpHeal(b,defSide,di);\n  if(defSide.hp[di]>0 && move.contact){\n    if(abilityHasEffect(d,\"contact_revenge\")){\n      const rd=Math.max(1,Math.floor(defSide.maxHp[di]/8));\n      attSide.hp[ai]=Math.max(0,attSide.hp[ai]-rd);\n      b.log.push(`${a.name}は${d.name}の特性で最大HPの1/8のダメージを受けた！`);\n    }\n    const revengeItem=itemWorks(d,moveType);\n    if(revengeItem?.effect===\"contact_revenge_item\"){\n      const rd=Math.max(1,Math.floor(defSide.maxHp[di]/8));\n      attSide.hp[ai]=Math.max(0,attSide.hp[ai]-rd);\n      b.log.push(`${a.name}は${d.name}の持ち物「${revengeItem.name||itemId(d)}」で最大HPの1/8のダメージを受けた！`);\n    }\n  }\n  if(survivedByAbility){const extra=Math.max(1,Math.floor(defSide.maxHp[di]/8));defSide.hp[di]=Math.max(1,defSide.hp[di]-extra);b.log.push(`${d.name}は特性で攻撃を一度耐え、その後最大HPの1/8を失った！`);}\n  const extra=r.mult>1?\" 効果はばつぐんだ！\":r.mult<1?\" 効果はいまひとつのようだ。\":\"\";\n  const typeNote=r.moveType!==move.type?`（タイプが${r.moveType}）`:\"\";\n  b.log.push(`${a.name}の${move.name}！${typeNote} ${d.name}に${damage}ダメージ。${extra}`);\n\n  const recoilItem=getItem(itemId(a));\n  if(recoilItem?.effect===\"life_orb\"&&defSide.hp[di]>0){const rd=Math.max(1,Math.floor(attSide.maxHp[ai]/10));attSide.hp[ai]=Math.max(0,attSide.hp[ai]-rd);b.log.push(`${a.name}はいのちのたまで反動を受けた。`);}\n  if(recoilItem?.effect===\"power_1_3_recoil\"&&defSide.hp[di]>0){const rd=Math.max(1,Math.floor(attSide.maxHp[ai]/16));attSide.hp[ai]=Math.max(0,attSide.hp[ai]-rd);b.log.push(`${a.name}は持ち物の反動で最大HPの1/16を失った。`);}\n  for(const aid of abilityIds(a)){const ab=getAbility(aid);if(!abilityEffects(ab).includes(\"power_1_3_recoil\")||!effectTypesMatch(ab,move.type))continue;const rd=Math.max(1,Math.floor(attSide.maxHp[ai]/16));attSide.hp[ai]=Math.max(0,attSide.hp[ai]-rd);b.log.push(`${a.name}は特性の反動で最大HPの1/16を失った。`);break;}\n\n  if(defSide.hp[di]>0 && effects.includes(\"remove_item\") && chance() && itemId(d)){const oldItem=getItem(itemId(d)); if(!isMegaStone(oldItem)){d.itemId=null;d.item=null;defSide.itemLost[di]=true;b.log.push(`${d.name}の持ち物「${oldItem?.name||\"\"}」がなくなった！`);} else { b.log.push(`${d.name}のメガストーンはなくならなかった！`); }}\n  if(defSide.hp[di]>0 && effects.includes(\"change_opponent_type\") && chance()){const types=Array.isArray(move.effectAddTypes)?move.effectAddTypes.filter(t=>ALL_TYPES.includes(t)):[move.effectAddType].filter(t=>ALL_TYPES.includes(t));d.type=types;b.log.push(`${d.name}のタイプが${types.length?types.join(\"・\"):\"なし\"}になった！`);}\n  if(defSide.hp[di]>0 && (move.status||effects.includes(\"inflict_status\")) && chance() && move.status) setStatus(b,defSide,di,move.status,move.category===\"status\");\n  if(defSide.hp[di]>0 && effects.includes(\"flinch\") && chance()) defSide.volatile[di].flinch=true;\n  if(defSide.hp[di]>0 && effects.includes(\"attack_then_switch\")){const alive=attSide.selected.filter(x=>x!==ai&&attSide.hp[x]>0);if(alive.length){b.log.push(`${a.name}は攻撃後に交代する！`);switched=true;}}\n  return {switched};\n}\nfunction megaEvolve(b,side){\n  normalizeBattleState(b);\n  if(b.over) throw new Error(\"この対戦は終了しています。\");\n  if(b.phase!==\"battle\") throw new Error(\"現在はメガ進化できません。\");\n  if(side.megaUsed) throw new Error(\"この対戦ではすでにメガ進化しています。\");\n  if(side.megaThisTurn) throw new Error(\"このターンはすでにメガ進化しています。\");\n  const i=side.active;\n  if(!Number.isInteger(i)||i<0||i>=side.team.length) throw new Error(\"場のポケモンが設定されていません。\");\n  const p=side.team[i], m=p.mega;\n  const heldItem=getItem(itemId(p));\n  if(!isMegaStone(heldItem)) throw new Error(`${p.name}はメガストーンを持っていないためメガ進化できません。`);\n  if(!m?.enabled) throw new Error(`${p.name}はメガ進化できません。`);\n  if(!m.stats || Object.values(m.stats).some(v=>!Number(v))) throw new Error(\"メガ進化後のステータスが設定されていません。\");\n  const oldName=p.name;\n  p.name=m.name||`メガ${p.name}`;\n  p.type=Array.isArray(m.type)&&m.type.length?m.type:p.type;\n  p.abilities=m.ability?[m.ability]:p.abilities;\n  p.stats={...p.stats,...m.stats};\n  p._mega=true; side.megaUsed=true; side.megaThisTurn=true;\n  const oldMax=side.maxHp[i], newMax=statValue(p,\"hp\");\n  const hpRatio=oldMax>0?side.hp[i]/oldMax:1;\n  side.maxHp[i]=newMax; side.hp[i]=Math.max(1,Math.min(newMax,Math.floor(newMax*hpRatio)));\n  b.log.push(`${oldName}はメガ進化して${p.name}になった！`);\n  // メガ進化は「交代」ではないため、場に出た時の特性・天候・持ち物処理を再発動しない。\n}\n\nfunction chooseEnemyMove(b){\n  const p=b.enemy.team[b.enemy.active], ids=Array.isArray(p.moves)?p.moves:[];\n  const usable=ids.map(getMove).filter(Boolean);return usable[Math.floor(Math.random()*usable.length)]||{id:\"tackle\",name:\"たいあたり\",type:\"ノーマル\",power:40,category:\"physical\",priority:0};\n}\nfunction priorityWithAbility(b,side,move,otherSide){\n  let p=Number(move.priority||0);\n  if(move.category===\"status\" && abilityHasEffect(side.team[side.active],\"status_priority_plus_1\")){\n    const other=otherSide?.team?.[otherSide.active];\n    if(!speciesTypes(other).includes(\"あく\")) p+=1;\n    else b.log.push(`${side.team[side.active].name}はあくタイプの相手に対して特性の優先度上昇効果を発揮できない！`);\n  }\n  return p;\n}\nfunction chooseTurnOrder(b,pm,em){\n  const pp=priorityWithAbility(b,b.player,pm,b.enemy);\n  const ep=priorityWithAbility(b,b.enemy,em,b.player);\n  if(pp!==ep)return pp>ep?[\"player\",\"enemy\"]:[\"enemy\",\"player\"];\n  const ps=effectiveSpeed(b.player,b.player.team[b.player.active]),es=effectiveSpeed(b.enemy,b.enemy.team[b.enemy.active]);\n  if(ps===es)return Math.random()<0.5?[\"player\",\"enemy\"]:[\"enemy\",\"player\"];\n  return ps>es?[\"player\",\"enemy\"]:[\"enemy\",\"player\"];\n}\nfunction chooseEnemySwitch(b){\n  const alive=b.enemy.selected.filter(i=>b.enemy.hp[i]>0&&i!==b.enemy.active);\n  if(!alive.length)return null;\n  if(b.enemy.hp[b.enemy.active]>0 && b.enemy.hp[b.enemy.active]>b.enemy.maxHp[b.enemy.active]/2)return null;\n  return alive.sort((x,y)=>b.enemy.hp[x]-b.enemy.hp[y]).pop();\n}\nfunction resolveFaints(b){\n  for(const side of [b.player,b.enemy]){\n    const i=side.active;\n    if(side.hp[i]>0)continue;\n    if(!side.logFainted?.[i]){side.logFainted=side.logFainted||{};side.logFainted[i]=true;b.log.push(`${side.team[i].name}は戦闘不能！`);}\n    const alive=side.selected.filter(x=>side.hp[x]>0);\n    if(!alive.length){b.over=true;b.result=side===b.player?\"lose\":\"win\";b.log.push(side===b.player?\"自分の3匹が戦闘不能。あなたの敗北です。\":\"相手の3匹が戦闘不能。あなたの勝利です！\");continue;}\n    if(side===b.enemy){const n=chooseEnemySwitch(b);if(n!==null&&n!==undefined){side.active=n;b.log.push(`相手は${side.team[n].name}を繰り出した！`);applySwitchIn(b,side);}}\n    else if(!b.over){ b.phase=\"switch_required\"; b.log.push(\"戦闘不能になったため、次のポケモンを選んでください。\"); }\n  }\n}\nfunction prepareTurn(b){b.player.protected.fill(false);b.enemy.protected.fill(false);for(const s of [b.player,b.enemy]){const v=s.volatile[s.active];if(v)v.flinch=false;}}\nfunction runTurn(b,playerMoveId){\n  normalizeBattleState(b);\n  if(b.over)throw new Error(\"この対戦は終了しています。\");\n  if(b.phase!==\"battle\")throw new Error(\"現在は行動を選択できません。\");\n  if(!Number.isInteger(b.player.active)||b.player.active<0)throw new Error(\"自分の場のポケモンが設定されていません。\");\n  if(!Number.isInteger(b.enemy.active)||b.enemy.active<0)throw new Error(\"相手の場のポケモンが設定されていません。\");\n  const pm=getMove(String(playerMoveId));if(!pm)throw new Error(\"技が見つかりません。\");\n  const p=b.player.team[b.player.active];if(!Array.isArray(p.moves)||!p.moves.map(String).includes(String(pm.id)))throw new Error(\"その技は使用できません。\");\n  const em=chooseEnemyMove(b);prepareTurn(b);\n  const order=chooseTurnOrder(b,pm,em);\n  for(const who of order){\n    if(b.over)break;\n    const as=who===\"player\"?b.player:b.enemy,ds=who===\"player\"?b.enemy:b.player,m=who===\"player\"?pm:em;\n    if(as.hp[as.active]<=0)continue;\n    if(as.volatile[as.active]?.flinch){b.log.push(`${as.team[as.active].name}はひるんで動けない！`);continue;}\n    const result=doMove(b,as,ds,m);\n    resolveFaints(b);\n    if(!b.over && result?.switched && as.hp[as.active]>0){\n      if(as===b.player){ b.phase=\"switch_required\"; }\n      else { const n=chooseEnemySwitch(b); if(n!==null&&n!==undefined){as.active=n;b.log.push(`相手は${as.team[n].name}を繰り出した！`);applySwitchIn(b,as);} }\n    }\n    if(b.phase===\"switch_required\") break;\n  }\n  if(!b.over && b.phase===\"battle\"){endTurnSide(b,b.player);endTurnSide(b,b.enemy);resolveFaints(b);}\n  if(!b.over && b.phase===\"battle\"){\n    b.player.megaThisTurn=false; b.enemy.megaThisTurn=false;\n    if(b.weather){b.weatherTurns--;if(b.weatherTurns<=0){b.log.push(`天候の${WEATHER_NAMES[b.weather]||b.weather}が消えた！`);b.weather=null;b.weatherTurns=0;}}\n    if(b.field){b.fieldTurns--;if(b.fieldTurns<=0){b.log.push(`フィールドの${FIELD_NAMES[b.field]||b.field}が消えた！`);b.field=null;b.fieldTurns=0;}}\n    for(const side of [b.player,b.enemy]) for(const w of Object.keys(WALL_NAMES)){if(side.walls[w]>0){side.walls[w]--;if(side.walls[w]===0)b.log.push(`${WALL_NAMES[w]}が消えた！`);}}\n    b.turn++;\n  }\n}\n\n\n  return {\n    setContent(rows){ battleData.content = Array.isArray(rows) ? rows : []; },\n    makeBattle,\n    normalizeBattleState,\n    publicBattle,\n    runTurn,\n    megaEvolve,\n    applySwitchIn,\n    doMove,\n    prepareTurn,\n    resolveFaints,\n    chooseEnemyMove\n  };\n})();\n";

<main class="app">
<header class="top">
  <div><p class="eyebrow">DEVELOPER CONSOLE</p><h1>開発者管理</h1><p class="muted">ポケモン・技・特性・持ち物・相手パーティをフォームから登録できます。JSONを直接入力する必要はありません。</p></div>
  <div class="row"><a class="secondary" href="#app">対戦サイト</a><button class="secondary" id="logout">ログアウト</button></div>
</header>

<section class="panel">
  <div class="grid">
    <div>
      <label>登録する種類
        <select id="kind">
          <option value="species">ポケモン</option>
          <option value="move">技</option>
          <option value="ability">特性</option>
          <option value="item">持ち物</option>
          <option value="enemy_team">相手パーティ</option>
        </select>
      </label>
      <div class="row">
        <button class="primary" id="new">新規登録</button>
        <button class="secondary" id="export">バックアップを書き出す</button>
      </div>
      <p id="msg" class="muted"></p>
      <div id="list" class="list"></div>
    </div>

    <div>
      <div id="form"></div>
      <div class="actions row">
        <button class="primary" id="save">保存</button>
        <button class="secondary danger" id="delete">削除</button>
      </div>
    </div>
  </div>
</section>

<section class="panel">
  <h2>登録の考え方</h2>
  <p class="hint">IDは英数字で分かりやすく付けてください。たとえば「10まんボルト」のIDを <b>thunderbolt</b> にしたら、ポケモンの技欄でも同じIDを選びます。フォームで選択した内容は、対戦エンジンが使うデータ形式に変換してSupabaseへ保存されます。</p>
</section>

<section class="panel">
  <h2>アカウント</h2>
  <p class="hint">GitHub Pages版ではパスワードを独自DBに保存せず、Supabase Authを使用します。開発者権限はSupabase SQL Editorで設定します。</p>
</section>
</main>

input[type=checkbox]{width:auto}.checkgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.check{display:flex;align-items:center;gap:7px;background:#181d26;border:1px solid #2a313d;border-radius:9px;padding:9px;color:#edf1f7;font-size:13px}
.section{border-top:1px solid #2a313d;margin-top:16px;padding-top:14px}.typegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.typecheck{display:flex;align-items:center;gap:8px;background:#181d26;border:1px solid #2a313d;border-radius:9px;padding:9px;color:#edf1f7;font-size:13px;margin:0}.typecheck input{width:auto;margin:0}@media(max-width:560px){.typegrid{grid-template-columns:1fr 1fr}}.hint{font-size:12px;color:#98a2b3;line-height:1.6}.actions{position:sticky;bottom:10px;background:#12161d;padding-top:12px;margin-top:16px}
.primary,.secondary{border-radius:10px;padding:11px 15px;border:1px solid #2a313d;cursor:pointer;text-decoration:none}.primary{background:#edf2f7;color:#0b0d12;font-weight:800}.secondary{background:#181d26;color:#edf1f7}.danger{border-color:#7d3030;color:#ff8b8b}.ok{color:#8ee6a7;min-height:20px}.error{color:#ff7777;min-height:20px}
.badge{display:inline-block;border:1px solid #2a313d;border-radius:999px;padding:4px 8px;font-size:11px;color:#aab3c0}.hidden{display:none!important}
@media(max-width:900px){.grid{grid-template-columns:1fr}.top{flex-direction:column}.two,.three,.six,.checkgrid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.two,.three,.six,.checkgrid{grid-template-columns:1fr}.app{width:min(100% - 20px,1240px)}}
`,script:`(function(){

const $=id=>document.getElementById(id);
let rows=[],allRows=[],selectedId=null;
const TYPES=['ノーマル','ほのお','みず','でんき','くさ','こおり','かくとう','どく','じめん','ひこう','エスパー','むし','いわ','ゴースト','ドラゴン','あく','はがね','フェアリー'];
const STATS=[['attack','攻撃'],['defense','防御'],['spAttack','特攻'],['spDefense','特防'],['speed','素早さ']];
const STAT_ALL=[['hp','HP'],...STATS];
const WEATHER=[['sun','はれ'],['rain','あめ'],['sand','すなあらし'],['snow','ゆき']];
const FIELD=[['electric','エレキフィールド'],['grassy','グラスフィールド'],['misty','ミストフィールド'],['psychic','サイコフィールド']];
const WALLS=[['light_screen','ひかりのかべ'],['reflect','リフレクター'],['aurora_veil','オーロラベール']];
const STATUS=[['burn','やけど'],['paralysis','まひ'],['poison','どく'],['toxic','もうどく'],['sleep','ねむり'],['freeze','こおり']];
const MOVE_EFFECTS=[
 ['swords_dance','つるぎのまい'],['nasty_plot','わるだくみ'],['dragon_dance','りゅうのまい'],['stat_boost','能力上昇'],['stat_drop','能力下降'],
 ['inflict_status','状態異常'],['flinch','ひるみ'],['remove_item','持ち物をなくす'],['change_opponent_type','相手のタイプ変更'],['attack_then_switch','攻撃後に交代'],
 ['stealth_rock','ステルスロック'],['spikes','まきびし'],['set_weather','天候変更'],['set_field','フィールド変更'],['light_screen','ひかりのかべ'],['reflect','リフレクター'],['aurora_veil','オーロラベール'],
 ['protect','まもる'],['recover','HP回復'],['item_power_1_5','持ち物を持つ相手への威力1.5倍'],['grassy_power_half','グラスフィールドで威力半減'],['wall_break','壁を無視']
];
const ABILITY_EFFECTS=[
 ['intimidate','いかく'],['drizzle','あめふらし'],['drought','ひでり'],['swift_swim','すいすい'],['chlorophyll','ようりょくそ'],['blaze','もうか'],['torrent','げきりゅう'],['huge_power','ちからもち'],
 ['slow_start','スロースタート'],['no_burn','やけど無効'],['no_paralysis','まひ無効'],['no_intimidate','いかく無効'],['type_immune','特定タイプ無効'],['status_immune','変化技無効'],['full_hp_survive','HP満タン時に1残して耐える'],
 ['full_hp_damage_half','HP満タン時に受けるダメージ半減'],['survive_once_1_8','一度だけ攻撃を耐える'],['contact_damage_half','接触技のダメージ半減'],['contact_revenge','接触技を受けた相手に反撃ダメージ'],['contact_power_1_3','接触技の威力1.3倍'],
 ['power_1_2','対応タイプの技の威力1.2倍'],['power_1_3_recoil','対応タイプの技の威力1.3倍＋反動'],['power_1_5_under_60','威力60未満の技1.5倍'],['faint_ally_power_1_1','瀕死の味方数に応じて威力上昇'],
 ['received_type_stat_boost','特定タイプの技を受けると能力上昇'],['change_move_type','技タイプ変更'],['first_move_type','最初に使った技のタイプになる'],['entry_attack_drop','登場時に相手の攻撃下降'],
 ['set_weather','登場時に天候変更'],['set_field','登場時にフィールド変更'],['status_priority_plus_1','変化技の優先度+1'],['no_miss_both','双方の技を必中扱い']
];
const ITEM_EFFECTS=[
 ['leftovers','たべのこし'],['life_orb','いのちのたま'],['choice_scarf','こだわりスカーフ'],['choice_1_5_lock','こだわり系（能力1.5倍＋技固定）'],['choice_attack_1_5','攻撃1.5倍＋技固定'],['choice_spAttack_1_5','特攻1.5倍＋技固定'],['choice_speed_1_5','素早さ1.5倍＋技固定'],
 ['stat_boost','登場時に能力上昇'],['stat_drop','登場時に能力下降'],['contact_revenge_item','接触技を受けた相手に反撃ダメージ'],['power_1_2','技の威力1.2倍'],['power_1_3_recoil','技の威力1.3倍＋反動'],['half_hp_heal_quarter','HP半分以下でHP1/4回復'],
 ['field_seed','フィールドで能力上昇して消費'],['mega_stone','メガストーン'],['weather_extend','対応天候を5ターン延長'],['field_extend','対応フィールドを5ターン延長'],['wall_extend','対応壁を5ターン延長'],['full_hp_survive','HP満タン時に1残して耐える']
];
const labelMap=o=>Object.fromEntries(o.map(x=>[x[0],x[1]]));
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opts=(arr,selected)=>arr.map(([v,n])=>\`<option value="\${esc(v)}" \${Array.isArray(selected)?selected.includes(v)?'selected':'':selected===v?'selected':''}>\${esc(n)}</option>\`).join('');
const multi=(id,arr,selected=[],size=6)=>\`<select id="\${id}" multiple size="\${size}">\${opts(arr,selected)}</select>\`;
const typeMulti=(id,selected=[])=>\`<div class="typegrid">\${TYPES.map(t=>\`<label class="typecheck"><input type="checkbox" name="\${esc(id)}" value="\${esc(t)}" \${selected.includes(t)?'checked':''}><span>\${esc(t)}</span></label>\`).join('')}</div>\`;
const typeChoice=(id,selected='',allowNone=true,max=1)=>{const vals=Array.isArray(selected)?selected:(selected?[selected]:[]);const none=allowNone?\`<label class="typecheck"><input type="checkbox" name="\${esc(id)}" value="" data-type-choice="\${esc(id)}" \${vals.length===0?'checked':''}><span>なし</span></label>\`:'';return \`<div class="typegrid">\${none}\${TYPES.map(t=>\`<label class="typecheck"><input type="checkbox" name="\${esc(id)}" value="\${esc(t)}" data-type-choice="\${esc(id)}" \${vals.includes(t)?'checked':''}><span>\${esc(t)}</span></label>\`).join('')}</div>\`};
const one=(id,arr,selected='')=>\`<select id="\${id}"><option value="">-- 選択 --</option>\${opts(arr,selected)}</select>\`;
function values(id){const el=$(id);if(el&&el.selectedOptions)return [...el.selectedOptions].map(x=>x.value);return [...document.querySelectorAll(\`input[name="\${CSS.escape(id)}"]:checked\`)].map(x=>x.value);}
function num(id,def=''){const v=$(id)?.value;return v===''?def:Number(v)}
function bool(id){return !!$(id)?.checked}
function show(t,ok=false){$('msg').className=ok?'ok':'muted';$('msg').textContent=t}
function speciesRows(){return allRows.filter(r=>r.kind==='species')}
function abilityRows(){return allRows.filter(r=>r.kind==='ability')}
function itemRows(){return allRows.filter(r=>r.kind==='item')}
function moveRows(){return allRows.filter(r=>r.kind==='move')}
function dataOf(r){return r?.data||{}}
function idName(r){const d=dataOf(r);return \`\${d.name||d.id||'(名前なし)'} (\${d.id||r.id})\`}
function idOptions(list,selected=[]){return list.map(r=>{const d=dataOf(r);return [String(d.id||''),d.name||d.id||String(r.id)]}) .filter(x=>x[0])}

function commonFields(d={}){
  return \`<div class="two"><label>ID<input id="dataId" value="\${esc(d.id||'')}" placeholder="例: pikachu"></label><label>名前<input id="dataName" value="\${esc(d.name||'')}" placeholder="表示名"></label></div>\`;
}
function statFields(d={}){
  const s=d.stats||{},e=d.evs||{};
  return \`<div class="section"><h3>能力値</h3><div class="six">\${STAT_ALL.map(([k,n])=>\`<label>\${n}<input id="stat_\${k}" type="number" min="0" max="999" value="\${Number(s[k]??(k==='hp'?100:70))}"></label>\`).join('')}</div><p class="hint">ゲーム内の計算式に使う基礎値です。努力値は下の欄で設定します。</p><h3>努力値</h3><div class="six">\${STAT_ALL.map(([k,n])=>\`<label>\${n}<input id="ev_\${k}" type="number" min="0" max="32" value="\${Number(e[k]??0)}"></label>\`).join('')}</div></div>\`;
}
function speciesForm(d={}){
 const nature=d.personality||{};
 return commonFields(d)+\`<div class="section"><h3>タイプ</h3>\${typeMulti('types',d.type||[])}</div>\${statFields(d)}
 <div class="section"><h3>性格補正</h3><div class="two"><label>上昇する能力\${one('natureUp',[['','なし'],...STATS],nature.up||'')}</label><label>下降する能力\${one('natureDown',[['','なし'],...STATS],nature.down||'')}</label></div></div>
 <div class="section"><h3>特性</h3>\${multi('abilities',idOptions(abilityRows()),d.abilities||[],4)}<p class="hint">登録済みの特性から選びます。通常は1つ以上を選択してください。</p></div>
 <div class="section"><h3>持ち物</h3>\${one('itemId',[['','なし'],...idOptions(itemRows())],d.itemId||d.item||'')}</div>
 <div class="section"><h3>技</h3>\${multi('moves',idOptions(moveRows()),d.moves||[],4)}<p class="hint">通常は4技まで。IDを直接入力する必要はありません。</p></div>
 <div class="section"><h3>メガ進化（必要な場合だけ）</h3><label class="check"><input id="megaEnabled" type="checkbox" \${d.mega?.enabled?'checked':''}> メガ進化可能</label><div class="two"><label>メガ後の名前<input id="megaName" value="\${esc(d.mega?.name||'')}" placeholder="メガ○○"></label><label>メガ後の特性\${one('megaAbility',idOptions(abilityRows()),d.mega?.ability||'')}</label></div><label>メガ後のタイプ\${typeMulti('megaType',d.mega?.type||[])}</label><div class="six">\${STATS.map(([k,n])=>\`<label>メガ後\${n}<input id="mega_\${k}" type="number" min="0" value="\${Number(d.mega?.stats?.[k]??(d.stats?.[k]??70))}"></label>\`).join('')}</div></div>\`;
}
function moveForm(d={}){
 const effects=d.effects?.length?d.effects:(d.effect?[d.effect]:[]);
 return commonFields(d)+\`<div class="section"><h3>基本設定</h3><div class="three"><label>タイプ\${typeChoice('moveType',d.type||'ノーマル',false,1)}</label><label>分類\${one('category',[['physical','物理'],['special','特殊'],['status','変化']],d.category||'physical')}</label><label>対象\${one('target',[['opponent','相手'],['self','自分'],['field','場']],d.target||'opponent')}</label></div><div class="three"><label>威力<input id="power" type="number" min="0" value="\${Number(d.power??0)}"></label><label>命中率<input id="accuracy" type="number" min="0" max="100" value="\${Number(d.accuracy??100)}"></label><label>優先度<input id="priority" type="number" min="-7" max="7" value="\${Number(d.priority??0)}"></label></div><label class="check"><input id="contact" type="checkbox" \${d.contact?'checked':''}> 接触技</label></div>
 <div class="section"><h3>追加効果</h3>\${multi('moveEffects',MOVE_EFFECTS,effects,9)}<label>追加効果の発動率（%）<input id="effectChance" type="number" min="0" max="100" value="\${Number(d.effectChance??100)}"></label></div>
 <div class="section"><h3>能力変化</h3><div class="three"><label>対象\${one('effectTarget',[['self','自分'],['opponent','相手']],d.effectTarget||'self')}</label><label>能力\${one('effectStat',STATS,d.effectStat||'attack')}</label><label>段階<input id="effectStages" type="number" min="1" max="3" value="\${Number(d.effectStages??1)}"></label></div></div>
 <div class="section"><h3>状態異常</h3>\${one('status',[['','なし'],...STATUS],d.status||'')}</div>
 <div class="section"><h3>天候・フィールド</h3><div class="two"><label>天候\${one('weather',[['','なし'],...WEATHER],d.weather||'')}</label><label>天候ターン数<input id="duration" type="number" min="1" max="99" value="\${Number(d.duration??5)}"></label><label>フィールド\${one('field',[['','なし'],...FIELD],d.field||'')}</label><label>フィールドターン数<input id="fieldDuration" type="number" min="1" max="99" value="\${Number(d.fieldDuration??d.duration??5)}"></label></div></div>
 <div class="section"><h3>相手タイプ変更</h3><div class="two"><label>変更後タイプ1\${typeChoice('effectAddType',d.effectAddType||'',true,1)}</label><label>変更後タイプ2\${typeChoice('effectAddType2',Array.isArray(d.effectAddTypes)?d.effectAddTypes[1]||'':'',true,1)}</label></div><p class="hint">2つ選ぶと2タイプになります。1つだけなら単タイプです。</p></div>
 <div class="section"><h3>特別設定</h3><label>この技が無効になる相手タイプ\${typeMulti('ineffectiveTypes',d.ineffectiveTypes||[])}</label></div>\`;
}
function abilityForm(d={}){
 const effects=d.effects?.length?d.effects:(d.effect?[d.effect]:[]);
 return commonFields(d)+\`<div class="section"><h3>特性効果</h3>\${multi('abilityEffects',ABILITY_EFFECTS,effects,10)}<p class="hint">複数選択できます。たとえば「特定タイプ無効」＋「能力上昇」のような組み合わせも可能です。</p></div>
 <div class="section"><h3>タイプ条件</h3><label>このタイプの技にだけ効果を発揮\${typeMulti('effectTypes',d.effectTypes||[])}</label></div>
 <div class="section"><h3>能力変化</h3><div class="three"><label>能力\${one('effectStat',STATS,d.effectStat||'attack')}</label><label>段階<input id="effectStages" type="number" min="1" max="3" value="\${Number(d.effectStages??1)}"></label><label>対象\${one('effectTarget',[['self','自分'],['opponent','相手']],d.effectTarget||'self')}</label></div></div>
 <div class="section"><h3>タイプ無効・技タイプ変更</h3><label>無効にするタイプ\${typeMulti('immuneTypes',d.immuneTypes||[])}</label><div class="two"><label>変更する技タイプ\${typeChoice('effectMoveType',d.effectMoveType||'',true,1)}</label><label>受けた技のタイプ\${typeChoice('receivedMoveType',d.receivedMoveType||'',true,1)}</label></div></div>
 <div class="section"><h3>受けた技で能力上昇</h3><div class="two"><label>上昇する能力\${one('receivedStat',[['','なし'],...STATS],d.receivedStat||'')}</label><label>上昇段階<input id="receivedStages" type="number" min="1" max="3" value="\${Number(d.receivedStages??1)}"></label></div></div>
 <div class="section"><h3>天候・フィールド</h3><div class="two"><label>天候\${one('weather',[['','なし'],...WEATHER],d.weather||'')}</label><label>天候ターン数<input id="weatherDuration" type="number" min="1" max="99" value="\${Number(d.weatherDuration??5)}"></label><label>フィールド\${one('field',[['','なし'],...FIELD],d.field||'')}</label><label>フィールドターン数<input id="fieldDuration" type="number" min="1" max="99" value="\${Number(d.fieldDuration??5)}"></label></div></div>\`;
}
function itemForm(d={}){
 const effect=d.effect||'';
 return commonFields(d)+\`<div class="section"><h3>持ち物効果</h3>\${one('itemEffect',ITEM_EFFECTS,effect)}</div>
 <div class="section"><h3>タイプ条件</h3><label>このタイプの技にだけ効果\${typeMulti('effectTypes',d.effectTypes||[])}</label></div>
 <div class="section"><h3>能力変化</h3><div class="three"><label>能力\${one('effectStat',STATS,d.effectStat||'attack')}</label><label>段階<input id="effectStages" type="number" min="1" max="3" value="\${Number(d.effectStages??1)}"></label><label>対象\${one('effectTarget',[['self','自分'],['opponent','相手']],d.effectTarget||'self')}</label></div></div>
 <div class="section"><h3>こだわり・フィールド・天候・壁</h3><label>能力補正の対象\${multi('choiceStats',STATS,d.choiceStats||[],5)}</label><div class="three"><label>対応天候\${one('effectWeather',[['','なし'],...WEATHER],d.effectWeather||'')}</label><label>対応フィールド\${one('effectField',[['','なし'],...FIELD],d.effectField||'')}</label><label>対応壁\${one('effectWall',[['','なし'],...WALLS],d.effectWall||'')}</label></div><label>フィールドシードの条件\${one('seedField',[['','なし'],...FIELD],d.seedField||'')}</label></div>
 <div class="section"><h3>消費設定</h3><label class="check"><input id="consume" type="checkbox" \${effect==='mega_stone'?'':(d.consume!==false?'checked':'')} \${effect==='mega_stone'?'disabled':''}> 効果発動後に持ち物を消費する</label>\${effect==='mega_stone'?'<p class="hint">メガストーンはメガ進化に使用します。メガ進化しても持ち物は消費されません。</p>':''}</div>\`;
}
function enemyForm(d={}){
 const ids=Array.isArray(d.species)?d.species:[];const list=idOptions(speciesRows());
 return commonFields(d)+\`<div class="section"><h3>相手パーティ</h3>\${[0,1,2,3,4,5].map(i=>\`<label>\${i+1}匹目\${one('enemy_'+i,[['','なし'],...list],ids[i]||'')}</label>\`).join('')}<label>最初に選出する3匹\${multi('enemySelected',[['0','1匹目'],['1','2匹目'],['2','3匹目'],['3','4匹目'],['4','5匹目'],['5','6匹目']],(d.selected||[0,1,2]).map(String),6)}</label><p class="hint">相手パーティは3匹以上必要です。最大6匹まで登録できます。</p></div>\`;
}
function renderForm(d={}){
 const k=$('kind').value;let html='';
 if(k==='species')html=speciesForm(d); else if(k==='move')html=moveForm(d); else if(k==='ability')html=abilityForm(d); else if(k==='item')html=itemForm(d); else html=enemyForm(d);
 $('form').innerHTML=html;
}
function collect(){
 const k=$('kind').value,id=$('dataId').value.trim(),name=$('dataName').value.trim();
 if(!id)throw new Error('IDを入力してください。'); if(!name)throw new Error('名前を入力してください。');
 if(k==='species'){
   const abilities=values('abilities'),moves=values('moves'),types=values('types'); if(!types.length)throw new Error('タイプを1つ以上選択してください。'); if(moves.length>4)throw new Error('技は4つまで選択してください。');
   const stats={},evs={}; STAT_ALL.forEach(([x])=>{stats[x]=num('stat_'+x,0);evs[x]=Math.max(0,Math.min(32,num('ev_'+x,0)))});
   const obj={id,name,type:types,stats,evs,personality:{},abilities,moves};
   const up=$('natureUp').value,down=$('natureDown').value;if(up)obj.personality.up=up;if(down)obj.personality.down=down;
   const item=$('itemId').value;if(item)obj.itemId=item;
   if(bool('megaEnabled')){const ms={};STATS.forEach(([x])=>ms[x]=num('mega_'+x,0));obj.mega={enabled:true,name:$('megaName').value.trim()||\`メガ\${name}\`,ability:$('megaAbility').value||null,type:values('megaType'),stats:ms};}
   return obj;
 }
 if(k==='move'){
   const effects=values('moveEffects');const status=$('status').value;if(status&&!effects.includes('inflict_status'))effects.push('inflict_status');
   const moveType=values('moveType').filter(Boolean)[0]||'';if(!moveType)throw new Error('技タイプを1つ選択してください。');
   const obj={id,name,type:moveType,category:$('category').value,power:num('power',0),accuracy:num('accuracy',100),priority:num('priority',0),contact:bool('contact'),target:$('target').value,effects,effectChance:num('effectChance',100),effectStat:$('effectStat').value,effectStages:num('effectStages',1),effectTarget:$('effectTarget').value};
   if(status)obj.status=status; const weather=$('weather').value;if(weather)obj.weather=weather;obj.duration=num('duration',5);const field=$('field').value;if(field)obj.field=field;obj.fieldDuration=num('fieldDuration',5);
   const t1=values('effectAddType').filter(Boolean)[0]||'',t2=values('effectAddType2').filter(Boolean)[0]||'';if(t1||t2)obj.effectAddTypes=[t1,t2].filter(Boolean);if(obj.effectAddTypes?.length===1)obj.effectAddType=obj.effectAddTypes[0];
   const ine=values('ineffectiveTypes');if(ine.length)obj.ineffectiveTypes=ine;
   return obj;
 }
 if(k==='ability'){
   const effects=values('abilityEffects');if(!effects.length)throw new Error('特性効果を1つ以上選択してください。');
   const effectMoveType=values('effectMoveType').filter(Boolean)[0]||'',receivedMoveType=values('receivedMoveType').filter(Boolean)[0]||'';
   const obj={id,name,effects,effectTypes:values('effectTypes'),effectStat:$('effectStat').value,effectStages:num('effectStages',1),effectTarget:$('effectTarget').value,immuneTypes:values('immuneTypes'),effectMoveType,receivedMoveType,receivedStat:$('receivedStat').value,receivedStages:num('receivedStages',1)};
   const w=$('weather').value;if(w){obj.weather=w;obj.weatherDuration=num('weatherDuration',5)} const f=$('field').value;if(f){obj.field=f;obj.fieldDuration=num('fieldDuration',5)}
   if(!obj.effectTypes.length)delete obj.effectTypes;if(!obj.immuneTypes.length)delete obj.immuneTypes;if(!obj.effectMoveType)delete obj.effectMoveType;if(!obj.receivedMoveType)delete obj.receivedMoveType;if(!obj.receivedStat)delete obj.receivedStat;if(!w){delete obj.weather;delete obj.weatherDuration}if(!f){delete obj.field;delete obj.fieldDuration}
   return obj;
 }
 if(k==='item'){
   const effect=$('itemEffect').value;if(!effect)throw new Error('持ち物効果を選択してください。');
   const obj={id,name,effect,effectTypes:values('effectTypes'),effectStat:$('effectStat').value,effectStages:num('effectStages',1),effectTarget:$('effectTarget').value,choiceStats:values('choiceStats'),effectWeather:$('effectWeather').value,effectField:$('effectField').value,effectWall:$('effectWall').value,seedField:$('seedField').value,consume:effect==='mega_stone'?false:bool('consume')};
   if(!obj.effectTypes.length)delete obj.effectTypes;if(!obj.choiceStats.length)delete obj.choiceStats;if(!obj.effectWeather)delete obj.effectWeather;if(!obj.effectField)delete obj.effectField;if(!obj.effectWall)delete obj.effectWall;if(!obj.seedField)delete obj.seedField;
   return obj;
 }
 const species=[];for(let i=0;i<6;i++){const v=$('enemy_'+i).value;if(v)species.push(v)}if(species.length<3)throw new Error('相手ポケモンを3匹以上選択してください。');const selected=values('enemySelected').map(Number).filter(i=>i<species.length);if(selected.length!==3)throw new Error('相手の選出を3匹選択してください。');return {id,name,species,selected};
}
function fillForm(d){renderForm(d)}
async function auth(){if(!SB){show('config.jsを設定してください。');return false}const {data:{session}}=await SB.auth.getSession();if(!session){location.hash='#login';return false}const {data:p}=await SB.from('profiles').select('username,role,enabled').eq('id',session.user.id).single();if(!p||p.role!=='developer'||p.enabled===false){location.hash='#app';return false}return true}
async function loadAll(){const {data,error}=await SB.from('content').select('id,kind,data').order('id');if(error){show(error.message);return}allRows=data||[];rows=allRows.filter(r=>r.kind===$('kind').value);renderList();renderForm({})}
function renderList(){$('list').innerHTML=rows.map(r=>\`<div class="item \${r.id===selectedId?'active':''}" data-id="\${r.id}"><b>\${esc(dataOf(r).name||dataOf(r).id||'(名前なし)')}</b><br><span class="muted">\${esc(dataOf(r).id||r.id)}</span></div>\`).join('')||'<p class="muted">登録なし</p>';document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>edit(Number(x.dataset.id)))}
function edit(id){const r=rows.find(x=>x.id===id);if(!r)return;selectedId=id;renderForm(dataOf(r));renderList()}
$('kind').onchange=async()=>{selectedId=null;await loadAll()};

document.addEventListener('change',e=>{const el=e.target;if(!el.matches('input[data-type-choice]'))return;const group=el.dataset.typeChoice;const boxes=[...document.querySelectorAll(\`input[data-type-choice="\${CSS.escape(group)}"]\`)];const checked=boxes.filter(x=>x.checked);if(!el.checked)return;if(el.value===''){boxes.forEach(x=>{if(x!==el)x.checked=false});return}boxes.filter(x=>x.value==='').forEach(x=>x.checked=false);const max=1;if(checked.length>max){boxes.filter(x=>x!==el&&x.checked).forEach(x=>x.checked=false)}});
$('new').onclick=()=>{selectedId=null;renderForm({});renderList();show('新規登録フォームです。')};
$('save').onclick=async()=>{try{const obj=collect(),kind=$('kind').value;if(selectedId){const {error}=await SB.from('content').update({data:obj,updated_at:new Date().toISOString()}).eq('id',selectedId);if(error)throw error}else{const {error}=await SB.from('content').insert({kind,data:obj});if(error)throw error}show('保存しました。',true);await loadAll()}catch(e){show(e.message||String(e))}};
$('delete').onclick=async()=>{if(!selectedId)return show('削除するデータを選択してください。');if(!confirm('このデータを削除しますか？'))return;const {error}=await SB.from('content').delete().eq('id',selectedId);if(error)return show(error.message);selectedId=null;show('削除しました。',true);await loadAll()};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(allRows.map(r=>({kind:r.kind,data:r.data})),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pokemon-content-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),0)};
$('logout').onclick=async()=>{await SB.auth.signOut();location.hash='#login'};
(async()=>{if(await auth())await loadAll()})();

})();`}};
function loadBattleEngine(){if(window.BattleEngine)return;const s=document.createElement('script');s.textContent=window.__BATTLE_ENGINE_SOURCE__;document.head.appendChild(s);}
function runPageScript(code){const s=document.createElement('script');s.textContent=code;document.body.appendChild(s);}
function showPage(route){route=(route||'login').replace(/^#/,'').split('?')[0];if(!PAGES[route])route='login';document.querySelectorAll('[data-spa-style]').forEach(x=>x.remove());document.body.innerHTML=PAGES[route].body;if(PAGES[route].style){const st=document.createElement('style');st.dataset.spaStyle='1';st.textContent=PAGES[route].style;document.head.appendChild(st);}if(route==='app')loadBattleEngine();runPageScript(PAGES[route].script);}
window.addEventListener('hashchange',()=>showPage(location.hash));showPage(location.hash||'#login');
